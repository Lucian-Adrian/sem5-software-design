  <text x="576.5" y="431" text-anchor="middle" font-size="12" font-style="italic" fill="#52627a" font-family="Arial, DejaVu Sans, sans-serif">JoinedGroup is optional; later failures preserve completed results. The sequence is not transactional.</text>
